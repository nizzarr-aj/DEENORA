name: DEENORA Android Build

on:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_CONFIGURED: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use uploaded Omar Hisham Al Arabi adhan recording
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          uploaded_audio="app/src/main/res/raw/The Adhan - Omar Hisham Al Arabi _ الأذان بصوت عمر هشام العربي _ The Call to Prayer(M4A_128K).mp3"
          test -s "$uploaded_audio"
          cp "$uploaded_audio" app/src/main/res/raw/adhan.mp3
          rm "$uploaded_audio"
          test -s app/src/main/res/raw/adhan.mp3
          test -s app/src/main/res/drawable/dinak_logo.jpg
          file app/src/main/res/raw/adhan.mp3

      - name: Bundle Amiri Quran font
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font app/src/main/assets/fonts
          curl --fail --location --retry 4 \
            'https://raw.githubusercontent.com/aliftype/amiri/d3d0c5cb6fe7196cb4a58608fc5c8ecd2e6e80fa/fonts/AmiriQuran.ttf' \
            --output app/src/main/res/font/amiri_quran.ttf
          curl --fail --location --retry 4 \
            'https://raw.githubusercontent.com/aliftype/amiri/d3d0c5cb6fe7196cb4a58608fc5c8ecd2e6e80fa/OFL.txt' \
            --output app/src/main/assets/fonts/AMIRI-OFL.txt
          test -s app/src/main/res/font/amiri_quran.ttf
          test -s app/src/main/assets/fonts/AMIRI-OFL.txt

      - name: Bundle verified Tanzil Uthmani Quran (114 surahs, 6236 ayahs)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/quran
          curl --fail --location --retry 4 \
            'https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/data/quran-uthmani.txt' \
            --output /tmp/quran-uthmani.txt
          curl --fail --location --retry 4 \
            'https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/LICENSE' \
            --output app/src/main/assets/quran/LICENSE.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6]
          verses = {number: {} for number in range(1, 115)}
          for raw_line in Path("/tmp/quran-uthmani.txt").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              parts = line.split("|", 2)
              if len(parts) != 3:
                  raise SystemExit(f"Invalid Tanzil row: {line[:80]!r}")
              surah, ayah = int(parts[0]), int(parts[1])
              text = parts[2]
              if surah not in verses or ayah != len(verses[surah]) + 1 or not text.strip():
                  raise SystemExit(f"Invalid or out-of-order ayah: {surah}:{ayah}")
              verses[surah][f"verse_{ayah}"] = text

          total = sum(len(items) for items in verses.values())
          if total != 6236:
              raise SystemExit(f"Expected 6236 ayahs, got {total}")
          for surah, expected_count in enumerate(expected, start=1):
              if len(verses[surah]) != expected_count:
                  raise SystemExit(f"Surah {surah}: expected {expected_count}, got {len(verses[surah])}")
              target = Path(f"app/src/main/assets/quran/surah_{surah}.json")
              target.write_text(
                  json.dumps({"verse": verses[surah]}, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8"
              )

          Path("app/src/main/assets/quran/SOURCE.txt").write_text(
              "Tanzil Quran Text (Uthmani, Version 1.1)\n"
              "Original source: https://tanzil.net/docs\n"
              "Source mirror: https://github.com/acfatah/tanzil/tree/052b515f3a24dfacbe4cafc3b89f0681a447f462\n"
              "Copyright (C) 2007-2021 Tanzil Project. License: Creative Commons Attribution 3.0.\n"
              "The Quran text is copied verbatim. No text edits or normalisation are applied.\n"
              "See LICENSE.txt and https://tanzil.net/docs/Text_License.\n",
              encoding="utf-8"
          )
          print(f"Validated and bundled {total} Tanzil Uthmani ayahs across 114 surahs.")
          PY

      - name: Verify Dinak logo asset
        run: test -s app/src/main/res/drawable/dinak_logo.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK platform
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Restore stable debug keystore
        if: env.DEBUG_KEYSTORE_CONFIGURED == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Create temporary debug keystore
        if: env.DEBUG_KEYSTORE_CONFIGURED != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print debug SHA-1 fingerprint
        run: |
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA-1:'

      - name: Verify stable signing fingerprint
        if: env.DEBUG_KEYSTORE_CONFIGURED == 'true'
        run: |
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DEENORA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release signing key
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DEENORA-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
