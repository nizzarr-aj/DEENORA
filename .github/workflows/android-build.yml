name: DEENORA Android Build

on:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_CONFIGURED: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle clear Masjid al-Haram adhan (CC BY 3.0)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Adhan,_Great_Mosque_of_Mecca_-_Jan_21,_2013.webm' \
            --output /tmp/masjid-al-haram-adhan.webm
          ffmpeg -y -i /tmp/masjid-al-haram-adhan.webm -vn -ac 1 -ar 44100 -b:a 128k \
            app/src/main/res/raw/adhan.mp3
          test -s app/src/main/res/raw/adhan.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 app/src/main/res/raw/adhan.mp3
          cat > app/src/main/res/raw/adhan_attribution.txt <<'EOF'
          Recording: Adhan, Great Mosque of Mecca - Jan 21, 2013
          Author/uploader: Seyfula Islam
          Source: https://commons.wikimedia.org/wiki/File:Adhan,_Great_Mosque_of_Mecca_-_Jan_21,_2013.webm
          Licence: Creative Commons Attribution 3.0 (CC BY 3.0)
          Licence URL: https://creativecommons.org/licenses/by/3.0/
          Changes: Converted from WebM/Vorbis to mono MP3 for Android offline playback.
          EOF

      - name: Bundle complete Uthmani Quran (114 surahs, 6236 ayahs)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/quran
          total=0
          for surah in $(seq 1 114); do
            url="https://raw.githubusercontent.com/semarketir/quranjson/master/source/surah/surah_${surah}.json"
            file="app/src/main/assets/quran/surah_${surah}.json"
            curl --fail --location --retry 4 --retry-delay 2 "$url" --output "$file"
            count=$(jq '[.verse | keys[] | select(startswith("verse_") and . != "verse_0")] | length' "$file")
            test "$count" -gt 0
            total=$((total + count))
          done
          test "$total" -eq 6236
          curl --fail --location --retry 4             'https://raw.githubusercontent.com/semarketir/quranjson/master/LICENSE'             --output app/src/main/assets/quran/LICENSE.txt
          cat > app/src/main/assets/quran/SOURCE.txt <<'EOF'
          Arabic Quran text dataset: quranjson by semarketir
          https://github.com/semarketir/quranjson
          Dataset states 6,236 verses, 114 surahs and 30 juz.
          Licence: MIT. See LICENSE.txt.
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK platform
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Restore stable debug keystore
        if: env.DEBUG_KEYSTORE_CONFIGURED == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Create temporary debug keystore
        if: env.DEBUG_KEYSTORE_CONFIGURED != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print debug SHA-1 fingerprint
        run: |
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA-1:'

      - name: Verify stable signing fingerprint
        if: env.DEBUG_KEYSTORE_CONFIGURED == 'true'
        run: |
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DEENORA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release signing key
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DEENORA-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
